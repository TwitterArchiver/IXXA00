  <div class="tweet-content">
  它不需要惊天动地的宣告，只是在某个寻常的下午，独自躺在床上，拿出一根极细的针，扎进那些盘根错节的旧事里。把那些不甘心的黏连，一处处挑开；把那些被拉扯变形的日子，重新从紧绷的痛楚中剥离出来。
  <br/>
  ​血会止住，肿会消退。
  <br/>
  ​那些被剥离开的空隙，一开始是空的，甚至会晃荡着凉意。但只要不去管它，不用假装自己无事发生。
  <br/>
  日子久了，底下的肉自然会慢慢长平，属于生活的胶原蛋白会一点点漫上来，把曾经深陷的泥沼，撑成一张平静的、可以安稳承接风雨的脸。
  <br/>

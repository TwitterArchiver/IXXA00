  8 月 20 日  夜酽
  <br/>
  雨
  <br/>
  <br/>
  今天晚上是做腊肉的时机。
  <br/>
  没有这种习俗，单纯的想通过一点介质保留点东西。
  <br/>
  <br/>
  心平气静地点起一盏灯，把一只小猪🐖仔细分割，身体上均匀地抹上盐巴，整理好，挂到通风处。
  <br/>
  <br/>
  这个时候不能着急品尝，也不能让它乱动。
  <br/>
  先让风慢慢吹，让时间一点一点带走水分，让肉里的氨基酸在漫长的沉淀中转化成独属于它的风味。
  <br/>
  <br/>
  有些东西，确实就是不能急。
  <br/>
  先各自挂在那里，好好经历自己的时间。
  <br/>
  <br/>
  等风吹够了，盐入味了，岁月把锋利的部分磨平，再取下来看看。
  <br/>
  <br/>
  也许到那时候一块普通的腊肉，也可以吉光片羽，积厚流光。
  <br/>

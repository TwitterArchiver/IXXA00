  人类的宿命感，其实早就藏在语法里了。
  <br/>
  那些真正由不得人的时刻——寒冷、疼痛、孤独、…和不由自主的喜欢，原来都是外界强加给我们的‘承受’。
  <br/>
  <br/>

  <br/>

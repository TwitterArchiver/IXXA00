  其实我也想过，在一个阳光明媚的大晴天，和你走肩并肩的走在街上某处，突然和你说一句：“我在这里为你流过眼泪。”

  <br/>
  九月份的秋天基本无雨，而这座城市在某一刻，永远的在我身上，下了一场不需要打伞的雨。

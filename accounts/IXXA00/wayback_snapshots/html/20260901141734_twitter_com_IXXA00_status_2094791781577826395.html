  今天看两个三岁的孩子在小区游乐场手拉手看着天，用生疏的词句努力描述天上的星星。看着他们，我突然觉得，这跟人在三十岁、六十岁时的对话，并无二致。
  <br/>
  我们一生都在遇见同行者，但命运早就用同频这种东西设下了门槛：人在不同的生命阶段，遇到的同行者就是不一样的；不同形状的灵魂，注定只能拼凑出不同的风景。
  <br/>
  无论你是三岁还是六十岁，能否对接得上，从来不在于你们说了多少话，而在于你们的灵魂是否在同一截频率上。
  <br/>
  而你是什么样的人，就会在什么样的阶段，遇到什么样的人。
  <br/>
  <br/>
  岁月往复，能互相理解的人，就算…
  <br/>
  <br/>
  算了，总有人懂我会说什么。

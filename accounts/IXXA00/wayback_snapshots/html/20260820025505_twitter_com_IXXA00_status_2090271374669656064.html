  最近大家可能察觉主包散发着巨量的厚重情绪表达。
  <br/>
  <br/>
  平时不会这样，是因为之前有人激发了我的情绪开关。
  <br/>
  <br/>
  我发现我有一个特点：一旦有人激发了我的情绪开关，我的情绪可能就会剧烈地倾泄在那个人的身上。
  <br/>
  <br/>
  你们可以把我理解成一条…鱿鱼？或者是…蘑菇吗？
  <br/>
  <br/>
  但因为失去了情绪出口，我的身体里又会冒出很多情绪化的碎片，又变成了文字，像孢子一样溢散到了社交媒体上，然后被你们看见。
  <br/>
  <br/>
  你们看到的，都是我内在的一部分，只不过它们失去了目标，漫无目的的飘在主播身边，星星闪闪的，然后随着时间一点点消散了。
  <br/>
  <br/>
  可能平时会很难看到。

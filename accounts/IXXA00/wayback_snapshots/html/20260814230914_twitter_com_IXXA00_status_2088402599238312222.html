  医美上有种痘坑凹陷的处理方法：用排针刺破皮肤，贴着肌底一点点探进去，把那些纠缠不清的纤维硬生生挑断。
  <br/>
  那针扎进去的时候，是没有声音的钝痛，血渗出来，皮和肉清晰的被撕开，清醒地感受着每一寸阻力和拉扯，结果是这会让让旧的坏死的组织割裂，胶原蛋白重新生长，让皮肤平整的唯一机会，就在这一切都在皮下改变，但外在，谁也看不见。
  <br/>

  其实最近两年一直在做的事情的主题就是，我自己到底是谁？
  <br/>
  说白了，我不想被社会，被别人认识我的人定义我，想寻找一个由内而外，自己挖掘出来的东西。
  <br/>
  我发现很多人确实都在这么做。
  <br/>
  我想成为的可能不是一个更加“符合某种标准”的人。
  <br/>
  而是一个可以同时容纳自己很多面的人：
  <br/>
  <br/>
  既可以强烈，也可以柔软。
  <br/>
  既可以主动，也可以依赖。
  <br/>
  既可以有欲望，也可以有感情。
  <br/>
  既可以喜欢男性身上的某些东西，也可以喜欢女性身上的某些东西。
  <br/>
  既不需要证明自己“正常”，也不需要为了显得特别而刻意反叛。
  <br/>
  <br/>
  我觉得我追求的可能是很多人也在追求的东西：
  <br/>
  <br/>
  想要的
  <br/>
  是一种完整感。

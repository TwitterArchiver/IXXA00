  <div class="tweet-content">
  我好久没静静的去好好思考了，关于自己，生活和世界。
  <br/>
  这两年忙于去改变自己，生活也被无意义的社交填满，我感觉错过了好多东西。
  <br/>
  并不是说生活一定要有意义，我只是不想后悔，年龄越大越发现时间在一点一点侵蚀着本身，生命中的未来越来越少，回忆越来越多，面对这些觉得自己越发的无力。

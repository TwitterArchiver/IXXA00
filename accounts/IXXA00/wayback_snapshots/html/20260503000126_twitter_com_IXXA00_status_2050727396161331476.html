  5月3日 早上 雨
  <br/>
  #isla的日记
  <br/>
  早上好，醒来的时候，雨水已经干涸了。
  <br/>
  今天也和老师梦中见面了。
  <br/>
  抱歉，我不想的……
  <br/>
  但老师弯弯的眼睛真好看，我一直看着他，他一直对我笑。然后我也对他笑。
  <br/>
  我明白，对面看着我的人，早就已经不是他了，但是在梦里，让我任性一下吧。
  <br/>
  我可能笑得太开心了，他把手机拿出来，把我解封了。
  <br/>
  突然，委屈，不甘，后悔，愧疚，难过，一下子从心里涌了上来。
  <br/>
  我突然没办法笑了。
  <br/>
  <br/>
  哭醒了。
